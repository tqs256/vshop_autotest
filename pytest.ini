[pytest]
addopts = -sv
markers =
    smoke : 冒烟
    come : 回归
log_file = ./log/test.log
log_file_level = info
log_file_format = %(asctime)s [函数:%(funcName)-20s] [line:%(lineno)-3d] %(levelname)s --%(message)-3s
log_date_format = "%Y-%m-%d %H:%M:%S"

log_cli = True
log_cli_format = %(asctime)s [函数:%(funcName)-20s] [line:%(lineno)-3d] %(levelname)s --%(message)-3s
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_cli_level = INFO